<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5fdf8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Surdo AI — O'zbek imo-ishora tili</title>
    <meta name="description" content="O'zbek imo-ishora tilini o'rganish va real vaqt tarjimon platformasi" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        min-height: 100%;
        /* Sayt bilan bir xil "Zumrad & Laym" palitrasi */
        background: #f5fdf8;
        color: #04291a;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body { overflow-x: hidden; }
      h1, h2, h3, h4 { font-family: 'Outfit', 'Inter', sans-serif; letter-spacing: -0.03em; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #10b981, #a3e635);
        border-radius: 8px; border: 2px solid transparent; background-clip: padding-box;
      }
      ::selection { background: rgba(16,185,129,.28); color: #04291a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
